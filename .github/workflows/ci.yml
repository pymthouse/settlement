name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      # The race detector matters here: the worker runs ordered lanes,
      # an offset tracker and a commit loop concurrently.
      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build binaries
        run: |
          go build ./cmd/producer
          go build ./cmd/worker
          go build ./cmd/settlementctl
          go build ./cmd/stripefake
          go build ./cmd/e2e

  e2e-konnect:
    name: Test-mode Konnect e2e
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || vars.SETTLEMENT_E2E == 'true'
    env:
      SETTLEMENT_OPENMETER_URL: ${{ vars.SETTLEMENT_OPENMETER_URL }}
      SETTLEMENT_OPENMETER_API_KEY: ${{ secrets.SETTLEMENT_OPENMETER_API_KEY }}
      SETTLEMENT_E2E_BILLING_PROFILE_ID: ${{ secrets.SETTLEMENT_E2E_BILLING_PROFILE_ID }}
      SETTLEMENT_E2E_PRODUCER_URL: ${{ vars.SETTLEMENT_E2E_PRODUCER_URL }}
      SETTLEMENT_E2E_WORKER_URL: ${{ vars.SETTLEMENT_E2E_WORKER_URL }}
      SETTLEMENT_E2E_STRIPEFAKE_URL: ${{ vars.SETTLEMENT_E2E_STRIPEFAKE_URL }}
      SETTLEMENT_E2E_CONNECT_ACCOUNT_ID: ${{ vars.SETTLEMENT_E2E_CONNECT_ACCOUNT_ID }}
      SETTLEMENT_STRIPE_API_BASE: ${{ vars.SETTLEMENT_STRIPE_API_BASE }}
      SETTLEMENT_STRIPE_SECRET_KEY: ${{ secrets.SETTLEMENT_STRIPE_SECRET_KEY }}
      SETTLEMENT_STRIPE_WEBHOOK_SECRETS: ${{ secrets.SETTLEMENT_STRIPE_WEBHOOK_SECRETS }}
      SETTLEMENT_RAILWAY_ENVIRONMENT: ${{ vars.SETTLEMENT_RAILWAY_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build e2e binaries
        run: |
          go build ./cmd/producer
          go build ./cmd/worker
          go build ./cmd/stripefake
          go build ./cmd/e2e

      - name: Refuse unsafe Railway / Stripe settings
        run: scripts/railway-e2e-env-check.sh

      - name: Run Konnect e2e
        run: ./e2e

  image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f deploy/Dockerfile -t pymthouse/settlement:ci .
