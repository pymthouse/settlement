# Settlement e2e stack: Redpanda, Redis, producer, worker and stripefake.
#
# This mirrors deploy/docker-compose.yml but routes Stripe calls through
# stripefake so the worker and producer can be exercised without touching the
# live Stripe API.
#
#   docker compose -f deploy/docker-compose.e2e.yml up -d --build
#   docker compose -f deploy/docker-compose.e2e.yml run --rm settlementctl topics ensure --partitions 3

name: settlement-e2e

x-settlement-image: &settlement-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile

x-kafka-env: &kafka-env
  SETTLEMENT_KAFKA_BROKERS: redpanda:9092
  SETTLEMENT_KAFKA_TOPIC_STRIPE: billing.stripe.events.v1
  SETTLEMENT_KAFKA_TOPIC_OPENMETER: billing.openmeter.invoices.v1
  SETTLEMENT_KAFKA_TOPIC_DLQ: billing.settlement.dlq.v1
  SETTLEMENT_KAFKA_REQUIRED_ACKS: "1"

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    environment:
      # Admin API bind; default loopback. Set REDPANDA_ADMIN_ADDR=0.0.0.0 to expose.
      REDPANDA_ADMIN_ADDR: ${REDPANDA_ADMIN_ADDR:-127.0.0.1}
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --check=false
      # Settlement never calls the Admin API; disable it and bind loopback by default.
      - --set=redpanda.enable_admin_api=false
      - --set=redpanda.admin=[{address:${REDPANDA_ADMIN_ADDR:-127.0.0.1},port:9644}]
    ports:
      - "127.0.0.1:19092:9092"
    healthcheck:
      # Kafka API only — rpk cluster health needs Admin API (:9644).
      test: ["CMD-SHELL", "rpk cluster metadata -X brokers=127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  producer:
    <<: *settlement-image
    command: ["producer"]
    environment:
      <<: *kafka-env
      SETTLEMENT_HTTP_ADDR: ":8080"
      SETTLEMENT_LOG_LEVEL: ${SETTLEMENT_LOG_LEVEL:-info}
      SETTLEMENT_STRIPE_WEBHOOK_SECRETS: ${SETTLEMENT_STRIPE_WEBHOOK_SECRETS:?set this to your Stripe endpoint secret}
      SETTLEMENT_OPENMETER_WEBHOOK_SECRETS: ${SETTLEMENT_OPENMETER_WEBHOOK_SECRETS:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *settlement-image
    command: ["worker"]
    environment:
      <<: *kafka-env
      SETTLEMENT_KAFKA_CONSUMER_GROUP: settlement-worker
      SETTLEMENT_METRICS_ADDR: ":8081"
      SETTLEMENT_LOG_LEVEL: ${SETTLEMENT_LOG_LEVEL:-info}
      SETTLEMENT_REDIS_URL: redis://redis:6379/0
      SETTLEMENT_OPENMETER_URL: ${SETTLEMENT_OPENMETER_URL:?set this to the Konnect/OpenMeter base URL}
      SETTLEMENT_OPENMETER_API_KEY: ${SETTLEMENT_OPENMETER_API_KEY:-}
      SETTLEMENT_STRIPE_API_BASE: http://stripefake:12111
      SETTLEMENT_STRIPE_SECRET_KEY: ${SETTLEMENT_STRIPE_SECRET_KEY:?set this to your Stripe secret key}
      SETTLEMENT_STRIPE_CHARGE_MODEL: direct
      SETTLEMENT_APPLICATION_FEE_BPS: ${SETTLEMENT_APPLICATION_FEE_BPS:-0}
      SETTLEMENT_START_OFFSET: ${SETTLEMENT_START_OFFSET:-first}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      stripefake:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  stripefake:
    <<: *settlement-image
    command: ["stripefake"]
    environment:
      SETTLEMENT_STRIPEFAKE_ADDR: ":12111"
      SETTLEMENT_STRIPE_WEBHOOK_URL: http://producer:8080/webhooks/stripe
      SETTLEMENT_STRIPE_WEBHOOK_SECRETS: ${SETTLEMENT_STRIPE_WEBHOOK_SECRETS:?set this to your Stripe endpoint secret}
    ports:
      - "127.0.0.1:12111:12111"
    depends_on:
      producer:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:12111/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  settlementctl:
    <<: *settlement-image
    entrypoint: ["/usr/local/bin/settlementctl"]
    environment:
      <<: *kafka-env
      SETTLEMENT_STRIPE_WEBHOOK_SECRETS: placeholder
    profiles: ["tools"]
    depends_on:
      redpanda:
        condition: service_healthy
